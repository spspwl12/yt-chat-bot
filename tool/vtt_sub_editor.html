<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTT 자막 편집기</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #09090b;
            --glass-bg: rgba(24, 24, 27, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.4);
            
            --danger: #ef4444;
            --danger-hover: #dc2626;
            
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            
            --panel-radius: 16px;
            --btn-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.08), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--panel-radius);
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .top-controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 24px;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 18px;
            border-radius: var(--btn-radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            letter-spacing: -0.2px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        input[type="file"] {
            display: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .video-section video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            max-height: 500px;
        }

        .custom-controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .custom-seekbar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: height 0.1s;
        }
        
        .custom-seekbar:hover {
            height: 8px;
        }

        .custom-seekbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-glow);
            transition: transform 0.1s;
        }

        .custom-seekbar:hover::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-display {
            margin-left: auto;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .video-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .video-info {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        .preview-bar {
            margin-top: 24px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: var(--btn-radius);
            text-align: center;
            font-size: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            line-height: 1.5;
            font-weight: 500;
        }

        .subtitle-section {
            display: flex;
            flex-direction: column;
            max-height: 750px;
        }

        .subtitle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .subtitle-header h2 {
            font-size: 18px;
            margin: 0;
            color: var(--text-main);
        }

        .sync-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: var(--btn-radius);
            border: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }

        .sync-controls label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .sync-controls select {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 6px 10px;
            outline: none;
            font-size: 13px;
        }

        .subtitle-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subtitle-list::-webkit-scrollbar {
            width: 6px;
        }

        .subtitle-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .subtitle-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .subtitle-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .cue-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-left: 4px solid rgba(255,255,255,0.1);
            border-radius: var(--btn-radius);
            padding: 16px;
            position: relative;
            transition: all 0.2s;
        }

        .cue-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: rgba(255,255,255,0.3);
        }

        .cue-item.active {
            border-left-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .cue-item.selected {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        .cue-header {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .time-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-right: 4px;
            margin-left: 4px;
        }

        .time-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
            width: 105px;
            text-align: center;
        }

        .btn-tiny {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn-icon {
            padding: 5px 8px;
            font-size: 11px;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn-del {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
            line-height: 1;
        }

        .btn-del:hover {
            background: var(--danger);
            color: #fff;
        }

        .cue-item textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .cue-item textarea:focus,
        .time-input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn-add-bottom {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            font-size: 15px;
        }

        .no-sub {
            color: var(--text-muted);
            font-style: italic;
            font-size: 14px;
        }

        @keyframes cueHighlight {
            0% {
                background: rgba(99, 102, 241, 0.2);
                border-left-color: var(--primary);
            }
            100% {
                background: rgba(255, 255, 255, 0.02);
                border-left-color: rgba(255,255,255,0.1);
            }
        }

        .cue-item.highlight {
            animation: cueHighlight 1s ease-out forwards;
        }

        @media(max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .top-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls-left, .controls-right {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>VTT 자막 편집기</h1>

        <div class="top-controls glass-panel">
            <div class="controls-left">
                <label for="videoInput" class="btn btn-secondary">
                    🎬 로컬 동영상
                    <input type="file" id="videoInput" accept="video/*,.ts,.mp4,.mkv,.avi,.webm,.mov,.flv,.wmv,.m4v,.3gp">
                </label>
                <button class="btn btn-secondary" onclick="promptVideoUrl()">🌐 URL 동영상</button>
                
                <label for="vttInput" class="btn btn-secondary" style="margin-left: 10px;">
                    📝 자막(VTT) 불러오기
                    <input type="file" id="vttInput" accept=".vtt">
                </label>
            </div>
            
            <div class="controls-right">
                <button class="btn btn-primary" onclick="exportVTT()">💾 VTT 내보내기</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="video-section glass-panel">
                <video id="videoPlayer" crossorigin="anonymous">
                    <track id="subtitleTrack" kind="subtitles" srclang="ko" label="Korean" default>
                </video>
                <div class="custom-controls">
                    <input type="range" class="custom-seekbar" id="seekBar" min="0" max="100" step="0.001" value="0">
                    <div class="controls-row">
                        <button class="btn btn-primary" id="btnPlay" onclick="togglePlay()" title="재생/일시정지">▶ 재생</button>
                        <button class="btn btn-secondary" id="btnStop" onclick="stopVideo()" title="정지">■ 정지</button>
                        
                        <div class="volume-control" style="display: flex; align-items: center; gap: 8px; margin-left: 10px;">
                            <span id="volumeIcon" style="font-size: 14px; cursor: pointer;" onclick="toggleMute()" title="음소거">🔊</span>
                            <input type="range" id="volumeSlider" min="0" max="100" step="0.1" value="75" class="custom-seekbar" style="width: 140px;" title="볼륨 조절 (우측 1/4은 증폭)">
                        </div>

                        <span class="time-display" id="timeDisplay">00:00:00.000 / 00:00:00.000</span>
                    </div>
                </div>
                <div class="video-nav">
                    <button class="btn btn-secondary btn-tiny" id="btnPrevUrl" onclick="navigateUrlVideo(-1)" style="display:none; margin-right:auto;" title="이전 동영상">&lt; 이전 영상</button>
                    <button class="btn btn-secondary btn-tiny" onclick="seekVideo(-1)" title="1초 뒤로">&lt;&lt; 1초</button>
                    <button class="btn btn-secondary btn-tiny" onclick="seekVideo(-0.1)" title="0.1초 뒤로">&lt; 0.1초</button>
                    <button class="btn btn-secondary btn-tiny" onclick="seekVideo(0.1)" title="0.1초 앞으로">0.1초 &gt;</button>
                    <button class="btn btn-secondary btn-tiny" onclick="seekVideo(1)" title="1초 앞으로">1초 &gt;&gt;</button>
                    <button class="btn btn-secondary btn-tiny" id="btnNextUrl" onclick="navigateUrlVideo(1)" style="display:none; margin-left:auto;" title="다음 동영상">다음 영상 &gt;</button>
                </div>
                <div class="video-info" id="videoInfo">동영상을 불러와주세요</div>
                <div class="preview-bar" id="previewBar"><span class="no-sub">자막 미리보기 영역</span></div>
            </div>

            <div class="subtitle-section glass-panel">
                <div class="subtitle-header">
                    <h2>자막 목록 <span id="cueCount" style="font-size:14px;color:var(--text-muted);font-weight:normal;"></span></h2>
                </div>
                <div class="sync-controls">
                    <label>싱크 일괄 조절:</label>
                    <select id="syncMode">
                        <option value="all">전체 자막</option>
                        <option value="fromSelected">선택 자막부터 끝까지</option>
                        <option value="selectedOnly">선택된 자막만</option>
                    </select>
                    <button class="btn btn-secondary btn-tiny" onclick="adjustSync(-0.5)">-0.5초</button>
                    <button class="btn btn-secondary btn-tiny" onclick="adjustSync(-0.1)">-0.1초</button>
                    <button class="btn btn-secondary btn-tiny" onclick="adjustSync(0.1)">+0.1초</button>
                    <button class="btn btn-secondary btn-tiny" onclick="adjustSync(0.5)">+0.5초</button>
                </div>
                <div class="subtitle-list" id="subtitleList">
                    <p class="no-sub">VTT 파일을 불러오거나 자막을 추가하세요</p>
                </div>
                <button class="btn btn-primary btn-add-bottom" onclick="addCue()">+ 새 자막 추가</button>
            </div>
        </div>
    </div>

    <script>
        let cues = [];
        let currentBlobUrl = null;
        let loadedVideoName = '';
        let loadedVttFileName = '';
        let videoUrl = '';
        let selectedCueIdx = -1;

        let video = document.getElementById('videoPlayer');
        const subtitleList = document.getElementById('subtitleList');
        const previewBar = document.getElementById('previewBar');
        const cueCount = document.getElementById('cueCount');
        const videoInfo = document.getElementById('videoInfo');
        const seekBar = document.getElementById('seekBar');
        const btnPlay = document.getElementById('btnPlay');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        let previousVolume = 1;
        let audioCtx = null;
        let gainNode = null;
        let mediaSource = null;

        function initAudio() {
            if (audioCtx) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                mediaSource = audioCtx.createMediaElementSource(video);
                gainNode = audioCtx.createGain();
                mediaSource.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            } catch (e) {
                console.warn('AudioContext 초기화 실패:', e);
                audioCtx = null;
                gainNode = null;
            }
        }

        function sliderToVolume(sliderVal) {
            const val = parseFloat(sliderVal);
            if (val <= 75) {
                return val / 75;
            } else {
                return 1 + ((val - 75) / 25) * 2;
            }
        }

        function volumeToSlider(vol) {
            if (vol <= 1) {
                return vol * 75;
            } else {
                return 75 + ((vol - 1) / 2) * 25;
            }
        }

        function applyVolume(v) {
            v = parseFloat(v);
            if (v > 1) {
                if (!audioCtx) initAudio();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(e => console.warn('Audio resume failed', e));
                }
            }
            
            if (gainNode) {
                gainNode.gain.value = v;
                video.volume = 1;
                video.muted = (v === 0);
            } else {
                video.volume = Math.min(1, v);
                video.muted = (v === 0);
            }
            
            if (volumeSlider) {
                volumeSlider.value = volumeToSlider(v);
            }
            
            updateVolumeUI(v, video.muted);
        }

        function updateVolumeUI(v, isMuted) {
            if (volumeIcon) {
                if (isMuted || v === 0) {
                    volumeIcon.textContent = '🔈';
                } else if (v < 0.5) {
                    volumeIcon.textContent = '🔉';
                } else {
                    volumeIcon.textContent = '🔊';
                }
            }
            if (volumeSlider) {
                const sliderVal = volumeToSlider(v);
                if (v <= 1) {
                    volumeSlider.style.background = `linear-gradient(to right, var(--primary) ${sliderVal}%, rgba(255, 255, 255, 0.1) ${sliderVal}%)`;
                } else {
                    volumeSlider.style.background = `linear-gradient(to right, var(--primary) 75%, #f97316 75%, #f97316 ${sliderVal}%, rgba(255, 255, 255, 0.1) ${sliderVal}%)`;
                }
            }
        }
        let isUserScrollingSubtitle = false;
        let subtitleScrollTimeout;

        subtitleList.addEventListener('wheel', function() {
            isUserScrollingSubtitle = true;
            clearTimeout(subtitleScrollTimeout);
            subtitleScrollTimeout = setTimeout(() => { isUserScrollingSubtitle = false; }, 2000);
        });
        subtitleList.addEventListener('touchmove', function() {
            isUserScrollingSubtitle = true;
            clearTimeout(subtitleScrollTimeout);
            subtitleScrollTimeout = setTimeout(() => { isUserScrollingSubtitle = false; }, 2000);
        });
        subtitleList.addEventListener('mouseenter', function() {
            isUserScrollingSubtitle = true;
        });
        subtitleList.addEventListener('mouseleave', function() {
            isUserScrollingSubtitle = false;
        });

        // 로컬스토리지 관련 함수
        function saveState() {
            const state = {
                cues,
                loadedVideoName,
                loadedVttFileName,
                videoUrl,
                videoVolume: volumeSlider ? sliderToVolume(volumeSlider.value) : video.volume,
                videoMuted: video.muted
            };
            try {
                localStorage.setItem('vttEditorState', JSON.stringify(state));
            } catch (e) {
                console.warn('로컬스토리지 저장 실패', e);
            }
        }

        function loadState() {
            try {
                const stateStr = localStorage.getItem('vttEditorState');
                if (stateStr) {
                    const state = JSON.parse(stateStr);
                    if (state.cues) cues = state.cues;
                    if (state.loadedVideoName) {
                        loadedVideoName = state.loadedVideoName;
                        videoInfo.textContent = '이전 동영상: ' + loadedVideoName;
                    }
                    if (state.loadedVttFileName) {
                        loadedVttFileName = state.loadedVttFileName;
                    }
                    if (state.videoUrl) {
                        videoUrl = state.videoUrl;
                        video.src = videoUrl;
                        videoInfo.textContent = 'URL: ' + videoUrl;
                        checkUrlNavigation(videoUrl);
                    }
                    if (state.videoVolume !== undefined) {
                        previousVolume = state.videoVolume;
                    }
                    if (state.videoMuted !== undefined) {
                        video.muted = state.videoMuted;
                    }
                    
                    const initV = (state.videoMuted && state.videoVolume !== undefined) ? 0 : (state.videoVolume !== undefined ? state.videoVolume : 1);
                    if (volumeSlider) {
                        applyVolume(initV);
                        if (state.videoMuted && state.videoVolume !== undefined) {
                            previousVolume = state.videoVolume;
                        }
                    }
                    
                    renderCues();
                    applyTrack();
                }
            } catch (e) {
                console.warn('로컬스토리지 불러오기 실패', e);
            }
        }

        window.addEventListener('DOMContentLoaded', loadState);

        // 로컬 동영상 처리
        document.getElementById('videoInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }
            currentBlobUrl = URL.createObjectURL(file);
            video.src = currentBlobUrl;
            video.load();
            
            loadedVideoName = file.name;
            videoUrl = ''; // 로컬 파일 로드 시 url 초기화
            
            videoInfo.textContent = '파일: ' + loadedVideoName + ' (' + formatBytes(file.size) + ')';
            applyTrack();
            saveState();
            checkUrlNavigation(''); // URL이 아니므로 네비게이션 버튼 숨김
        });

        // URL 동영상 입력창 띄우기
        function promptVideoUrl() {
            const url = prompt("동영상 URL을 입력하세요:", videoUrl);
            if(url !== null && url.trim() !== '') {
                loadVideoFromUrl(url.trim());
            }
        }

        function extractFilename(url) {
            if (!url) return 'URL Video';
            try {
                const urlObj = new URL(url, window.location.href);
                for (const [key, value] of urlObj.searchParams) {
                    if (value.match(/\.(mp4|mkv|webm|ogg|mov|avi|ts|vtt)$/i)) {
                        const lastSlash = value.lastIndexOf('/');
                        return lastSlash !== -1 ? value.substring(lastSlash + 1) : value;
                    }
                }
            } catch (e) {}

            let decoded = url;
            try { decoded = decodeURI(url); } catch(e) {}
            
            const qIdx = decoded.indexOf('?');
            let pathPart = decoded;
            let queryPart = '';
            if (qIdx !== -1) {
                pathPart = decoded.substring(0, qIdx);
                queryPart = decoded.substring(qIdx);
            }
            
            const queryMatch = queryPart.match(/[^/=&?]+\.(mp4|mkv|webm|ogg|mov|avi|ts|vtt)(?=[&?#]|$)/i);
            if (queryMatch) return queryMatch[0];
            
            const hIdx = pathPart.indexOf('#');
            if (hIdx !== -1) pathPart = pathPart.substring(0, hIdx);
            
            const lastSlash = pathPart.lastIndexOf('/');
            if (lastSlash !== -1) {
                return pathPart.substring(lastSlash + 1) || 'URL Video';
            }
            return pathPart || url;
        }

        // URL 동영상 처리
        async function loadVideoFromUrl(targetUrl, autoplay = false) {
            if(!targetUrl) return;
            video.src = targetUrl;
            video.load();
            if (autoplay) {
                video.play().catch(e => console.warn('Autoplay failed:', e));
                btnPlay.innerHTML = '⏸ 일시정지';
            }
            videoUrl = targetUrl;
            cues = [];
            loadedVttFileName = '';
            renderCues();
            
            let filename = extractFilename(targetUrl);
            
            loadedVideoName = filename;
            videoInfo.textContent = 'URL: ' + videoUrl;

            // Attempt to load VTT
            const lastDotIdx = targetUrl.lastIndexOf('.');
            if (lastDotIdx !== -1) {
                const vttUrl = targetUrl.substring(0, lastDotIdx) + '.vtt';
                try {
                    const response = await fetch(vttUrl);
                    if (response.ok) {
                        const text = await response.text();
                        parseVTT(text);
                        const dotIdx = filename.lastIndexOf('.');
                        const baseName = dotIdx !== -1 ? filename.substring(0, dotIdx) : filename;
                        loadedVttFileName = baseName + '.vtt';
                        renderCues();
                    }
                } catch (e) {
                    console.log("VTT load failed or doesn't exist:", e);
                }
            }

            applyTrack();
            saveState();
            checkUrlNavigation(targetUrl);
        }

        function checkUrlNavigation(url) {
            const btnPrev = document.getElementById('btnPrevUrl');
            const btnNext = document.getElementById('btnNextUrl');
            if(!btnPrev || !btnNext) return;
            
            if (!url) {
                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
                return;
            }

            const filename = url.substring(url.lastIndexOf('/') + 1);
            const lastDotIdx = filename.lastIndexOf('.');
            const baseName = lastDotIdx !== -1 ? filename.substring(0, lastDotIdx) : filename;
            const match = baseName.match(/\d+/);
            
            if (match) {
                btnPrev.style.display = 'inline-flex';
                btnNext.style.display = 'inline-flex';
            } else {
                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
            }
        }

        function navigateUrlVideo(direction) {
            const currentUrl = videoUrl;
            if(!currentUrl) return;
            
            const lastSlashIdx = currentUrl.lastIndexOf('/');
            const pathPrefix = currentUrl.substring(0, lastSlashIdx + 1);
            const filename = currentUrl.substring(lastSlashIdx + 1);
            
            const lastDotIdx = filename.lastIndexOf('.');
            const baseName = lastDotIdx !== -1 ? filename.substring(0, lastDotIdx) : filename;
            const extension = lastDotIdx !== -1 ? filename.substring(lastDotIdx) : '';
            
            const matches = [...baseName.matchAll(/\d+/g)];
            if(matches.length === 0) return;
            
            const lastMatch = matches[matches.length - 1];
            const numStr = lastMatch[0];
            const numIdx = lastMatch.index;
            
            const numValue = parseInt(numStr, 10);
            const newNumValue = numValue + direction;
            if(newNumValue < 0) return;
            
            const paddedNewNum = String(newNumValue).padStart(numStr.length, '0');
            const newBaseName = baseName.substring(0, numIdx) + paddedNewNum + baseName.substring(numIdx + numStr.length);
            const newUrl = pathPrefix + newBaseName + extension;
            
            loadVideoFromUrl(newUrl, true);
        }

        // 로컬 VTT 처리
        document.getElementById('vttInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            loadedVttFileName = file.name;
            
            const reader = new FileReader();
            reader.onload = function (ev) {
                parseVTT(ev.target.result);
                renderCues();
                applyTrack();
                saveState();
            };
            reader.readAsText(file);
        });

        function parseVTT(text) {
            cues = [];
            const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            let i = 0;
            if (lines[0] && lines[0].trim().startsWith('WEBVTT')) {
                i = 1;
            }
            while (i < lines.length && lines[i].trim() === '') i++;
            while (i < lines.length) {
                while (i < lines.length && lines[i].trim() === '') i++;
                if (i >= lines.length) break;
                let id = '';
                if (i < lines.length && lines[i].indexOf('-->') === -1) {
                    id = lines[i].trim();
                    i++;
                }
                if (i < lines.length && lines[i].indexOf('-->') !== -1) {
                    const timeParts = lines[i].split('-->');
                    const startTime = timeParts[0].trim();
                    const endTime = timeParts[1].trim();
                    i++;
                    let textLines = [];
                    while (i < lines.length && lines[i].trim() !== '') {
                        textLines.push(lines[i]);
                        i++;
                    }
                    cues.push({
                        id: id || ('cue-' + cues.length),
                        start: startTime,
                        end: endTime,
                        text: textLines.join('\n')
                    });
                } else {
                    i++;
                }
            }
        }

        function renderCues() {
            if (cues.length === 0) {
                subtitleList.innerHTML = '<p class="no-sub">VTT 파일을 불러오거나 자막을 추가하세요</p>';
                cueCount.textContent = '';
                return;
            }
            cueCount.textContent = '(' + cues.length + '개)';
            let html = '';
            cues.forEach(function (c, idx) {
                const selClass = idx === selectedCueIdx ? ' selected' : '';
                html += `
                <div class="cue-item${selClass}" id="cueItem${idx}" data-idx="${idx}" onclick="selectCue(${idx}, event)">
                    <button class="btn-del" onclick="deleteCue(${idx})" title="삭제">&times;</button>
                    <div class="cue-header">
                        <button class="btn btn-secondary btn-tiny" onclick="goToCue(${idx})">이동</button>
                        
                        <span class="time-label">시작</span>
                        <input type="text" class="time-input" id="startTime${idx}" value="${escapeHtml(c.start)}" onchange="updateCue(${idx},'start',this.value)" placeholder="00:00:00.000">
                        <button class="btn btn-secondary btn-icon" onclick="adjustCueTime(${idx}, 'start', -0.1)" title="0.1초 당기기">&lt;</button>
                        <button class="btn btn-secondary btn-tiny" onclick="setCurrentTime(${idx},'start')" title="현재 영상 시간으로">현재</button>
                        <button class="btn btn-secondary btn-icon" onclick="adjustCueTime(${idx}, 'start', 0.1)" title="0.1초 늦추기">&gt;</button>
                        
                        <span class="time-label">종료</span>
                        <input type="text" class="time-input" id="endTime${idx}" value="${escapeHtml(c.end)}" onchange="updateCue(${idx},'end',this.value)" placeholder="00:00:00.000">
                        <button class="btn btn-secondary btn-icon" onclick="adjustCueTime(${idx}, 'end', -0.1)" title="0.1초 당기기">&lt;</button>
                        <button class="btn btn-secondary btn-tiny" onclick="setCurrentTime(${idx},'end')" title="현재 영상 시간으로">현재</button>
                        <button class="btn btn-secondary btn-icon" onclick="adjustCueTime(${idx}, 'end', 0.1)" title="0.1초 늦추기">&gt;</button>
                    </div>
                    <textarea rows="2" onchange="updateCue(${idx},'text',this.value)" placeholder="자막 텍스트 입력...">${escapeHtml(c.text)}</textarea>
                </div>`;
            });
            subtitleList.innerHTML = html;
        }

        function updateCue(idx, field, value) {
            if (cues[idx]) {
                cues[idx][field] = value;
                applyTrack();
                saveState();
            }
        }

        function adjustCueTime(idx, field, offset) {
            if (cues[idx]) {
                const currentSec = vttTimeToSeconds(cues[idx][field]);
                const newSec = Math.max(0, currentSec + offset);
                const newStr = secondsToVTTTime(newSec);
                cues[idx][field] = newStr;
                
                const inputId = field === 'start' ? 'startTime' + idx : 'endTime' + idx;
                const inputEl = document.getElementById(inputId);
                if(inputEl) inputEl.value = newStr;
                
                if (video) video.currentTime = newSec;
                
                applyTrack();
                saveState();
            }
        }

        function deleteCue(idx) {
            cues.splice(idx, 1);
            renderCues();
            applyTrack();
            saveState();
        }

        function addCue() {
            const currentTime = video.currentTime || 0;
            const startStr = secondsToVTTTime(currentTime);
            const endStr = secondsToVTTTime(currentTime + 3);
            const newCue = {
                id: 'cue-' + Date.now(),
                start: startStr,
                end: endStr,
                text: '새 자막'
            };
            const currentMs = currentTime * 1000;
            let insertIdx = cues.length;
            for (let i = 0; i < cues.length; i++) {
                if (vttTimeToSeconds(cues[i].start) * 1000 > currentMs) {
                    insertIdx = i;
                    break;
                }
            }
            cues.splice(insertIdx, 0, newCue);
            renderCues();
            applyTrack();
            saveState();

            const newEl = document.getElementById('cueItem' + insertIdx);
            if (newEl) {
                newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                newEl.classList.add('highlight');
                const textarea = newEl.querySelector('textarea');
                if (textarea) textarea.focus();
                setTimeout(function () { newEl.classList.remove('highlight'); }, 1000);
            }
        }

        function timeToMs(timeStr) {
            const [h, m, s] = timeStr.split(":");
            const [sec, ms = "0"] = s.split(".");
            return (
                parseInt(h) * 3600000 +
                parseInt(m) * 60000 +
                parseInt(sec) * 1000 +
                parseInt(ms)
            );
        }

        function exportVTT() {
            if (cues.length === 0) {
                alert('내보낼 자막이 없습니다.');
                return;
            }
            let vtt = 'WEBVTT\n\n';
            cues.sort((a, b) => timeToMs(a.start) - timeToMs(b.start));
            cues.forEach(function (c, idx) {
                vtt += (idx + 1) + '\n';
                vtt += c.start + ' --> ' + c.end + '\n';
                vtt += c.text + '\n\n';
            });
            const blob = new Blob([vtt], { type: 'text/vtt;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            let finalName = loadedVttFileName;
            if (!finalName && loadedVideoName) {
                const dotIdx = loadedVideoName.lastIndexOf('.');
                const baseName = dotIdx !== -1 ? loadedVideoName.substring(0, dotIdx) : loadedVideoName;
                finalName = baseName + '.vtt';
            }
            if (!finalName) finalName = 'subtitles.vtt';
            a.download = finalName;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function applyTrack() {
            let oldTrack = document.getElementById('subtitleTrack');
            if (oldTrack) {
                if (oldTrack.track) oldTrack.track.mode = 'hidden';
                oldTrack.remove();
            }
            
            if (video.textTracks) {
                for (let i = 0; i < video.textTracks.length; i++) {
                    video.textTracks[i].mode = 'hidden';
                }
            }
            
            if (cues.length === 0) return;

            let vtt = 'WEBVTT\n\n';
            cues.forEach(function (c, idx) {
                vtt += (idx + 1) + '\n';
                vtt += c.start + ' --> ' + c.end + '\n';
                vtt += c.text + '\n\n';
            });
            const blob = new Blob([vtt], { type: 'text/vtt' });
            const url = URL.createObjectURL(blob);
            
            const track = document.createElement('track');
            track.id = 'subtitleTrack';
            track.kind = 'subtitles';
            track.srclang = 'ko';
            track.label = 'Korean';
            track.default = true;
            track.src = url;
            video.appendChild(track);
            
            track.onload = function() {
                if (track.track) track.track.mode = 'showing';
            };
            setTimeout(() => {
                if (track.track && track.track.mode !== 'showing') {
                    track.track.mode = 'showing';
                }
            }, 50);
        }

        function goToCue(idx) {
            const c = cues[idx];
            if (c) {
                const seconds = vttTimeToSeconds(c.start);
                if (!isNaN(seconds)) {
                    video.currentTime = seconds;
                    video.play();
                }
            }
        }

        function seekVideo(offset) {
            if (video.readyState > 0) {
                video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + offset));
            }
        }

        function selectCue(idx, event) {
            if (event && (event.target.tagName === 'BUTTON' || event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA')) return;
            if (selectedCueIdx === idx) {
                selectedCueIdx = -1;
            } else {
                selectedCueIdx = idx;
            }
            document.querySelectorAll('.cue-item').forEach(function (el, i) {
                el.classList.toggle('selected', i === selectedCueIdx);
            });
        }

        function adjustSync(offset) {
            const mode = document.getElementById('syncMode').value;
            let startIdx = 0, endIdx = cues.length;
            if (mode === 'selectedOnly') {
                if (selectedCueIdx < 0 || selectedCueIdx >= cues.length) { alert('자막을 먼저 선택하세요.'); return; }
                startIdx = selectedCueIdx;
                endIdx = selectedCueIdx + 1;
            } else if (mode === 'fromSelected') {
                if (selectedCueIdx < 0 || selectedCueIdx >= cues.length) { alert('자막을 먼저 선택하세요.'); return; }
                startIdx = selectedCueIdx;
            }
            for (let i = startIdx; i < endIdx; i++) {
                const newStart = Math.max(0, vttTimeToSeconds(cues[i].start) + offset);
                const newEnd = Math.max(0, vttTimeToSeconds(cues[i].end) + offset);
                cues[i].start = secondsToVTTTime(newStart);
                cues[i].end = secondsToVTTTime(newEnd);
            }
            renderCues();
            applyTrack();
            saveState();
        }

        function setCurrentTime(idx, field) {
            const timeStr = secondsToVTTTime(video.currentTime);
            cues[idx][field] = timeStr;
            const inputId = field === 'start' ? 'startTime' + idx : 'endTime' + idx;
            const inputEl = document.getElementById(inputId);
            if (inputEl) inputEl.value = timeStr;
            applyTrack();
            saveState();
        }

        function bindVideoEvents() {
            video.addEventListener('timeupdate', function () {
                const t = video.currentTime;
                const d = video.duration || 0;
                seekBar.value = d > 0 ? (t / d) * 100 : 0;
                timeDisplay.textContent = secondsToVTTTime(t) + ' / ' + secondsToVTTTime(d);
                let found = false;
                cues.forEach(function (c, idx) {
                    const s = vttTimeToSeconds(c.start);
                    const e = vttTimeToSeconds(c.end);
                    const el = document.getElementById('cueItem' + idx);
                    if (t >= s && t <= e) {
                        if (el) { 
                            el.classList.add('active'); 
                            if (!isUserScrollingSubtitle) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); 
                            }
                        }
                        previewBar.innerHTML = '<span>' + escapeHtml(c.text).replace(/\n/g, '<br>') + '</span>';
                        found = true;
                    } else {
                        if (el) el.classList.remove('active');
                    }
                });
                if (!found) {
                    previewBar.innerHTML = '<span class="no-sub">—</span>';
                }
            });

            video.addEventListener('play', function () {
                btnPlay.innerHTML = '⏸ 일시정지';
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(e => {});
                }
            });
            video.addEventListener('pause', function () {
                btnPlay.innerHTML = '▶ 재생';
            });
            video.addEventListener('loadedmetadata', function () {
                seekBar.value = 0;
                timeDisplay.textContent = '00:00:00.000 / ' + secondsToVTTTime(video.duration);
            });
            
            video.addEventListener('volumechange', function () {
                if (!gainNode && volumeSlider) {
                    const v = video.muted ? 0 : video.volume;
                    volumeSlider.value = volumeToSlider(v);
                    updateVolumeUI(v, video.muted);
                }
            });
        }
        bindVideoEvents();

        if (volumeSlider) {
            volumeSlider.addEventListener('input', function () {
                const v = sliderToVolume(volumeSlider.value);
                applyVolume(v);
                saveState();
            });
            // 초기 스타일 적용을 위한 호출
            updateVolumeUI(sliderToVolume(volumeSlider.value), video.muted);
        }

        function toggleMute() {
            const currentV = volumeSlider ? sliderToVolume(volumeSlider.value) : video.volume;
            if (video.muted || currentV === 0) {
                video.muted = false;
                const restoreV = previousVolume > 0 ? previousVolume : 1;
                applyVolume(restoreV);
            } else {
                previousVolume = currentV;
                applyVolume(0);
            }
            saveState();
        }

        seekBar.addEventListener('input', function () {
            if (video.duration) {
                video.currentTime = (seekBar.value / 100) * video.duration;
            }
        });

        function togglePlay() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(e => {});
            }
            if (video.paused || video.ended) {
                video.play();
            } else {
                video.pause();
            }
        }

        function stopVideo() {
            video.pause();
            video.currentTime = 0;
        }

        function vttTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.trim().split(':');
            let h = 0, m = 0, s = 0;
            if (parts.length === 3) {
                h = parseFloat(parts[0]);
                m = parseFloat(parts[1]);
                s = parseFloat(parts[2]);
            } else if (parts.length === 2) {
                m = parseFloat(parts[0]);
                s = parseFloat(parts[1]);
            }
            return h * 3600 + m * 60 + s;
        }

        function secondsToVTTTime(totalSec) {
            if (isNaN(totalSec) || !isFinite(totalSec)) totalSec = 0;
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = (totalSec % 60).toFixed(3);
            return pad2(h) + ':' + pad2(m) + ':' + padSec(s);
        }

        function pad2(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        function padSec(s) {
            const parts = ('' + s).split('.');
            const intPart = parts[0].length < 2 ? '0' + parts[0] : parts[0];
            const decPart = parts[1] ? (parts[1] + '000').substring(0, 3) : '000';
            return intPart + '.' + decPart;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
